<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Focal Loss：简单样本别淹没难题"><title>Focal Loss：简单样本别淹没难题</title><rect width="1200" height="675" rx="24" fill="#101F24"/><g font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif"><text x="48" y="70" fill="#F3EDE1" font-size="34" font-weight="700" text-anchor="start">Focal Loss：简单样本别淹没难题</text><text x="48" y="115" fill="#B8CCC9" font-size="25" font-weight="400" text-anchor="start">L = −αₜ (1 − pₜ)ᵞ ln(pₜ)；这里 αₜ = 1，γ = 2。</text><rect x="48" y="158" width="530" height="340" rx="18" fill="#182F35" stroke="#34545B"/><text x="76" y="211" fill="#A5E1C8" font-size="29" font-weight="700" text-anchor="start">容易样本</text><text x="76" y="266" fill="#F3EDE1" font-size="32" font-weight="400" text-anchor="start">pₜ = 0.99</text><text x="76" y="323" fill="#A5E1C8" font-size="30" font-weight="700" text-anchor="start">乘法权重 = 0.0001</text><text x="76" y="370" fill="#B8CCC9" font-size="24" font-weight="400" text-anchor="start">交叉熵 = 0.01005</text><text x="76" y="425" fill="#A5E1C8" font-size="27" font-weight="700" text-anchor="start">Focal loss = 0.000001</text><line x1="76" y1="457" x2="538" y2="457" stroke="#34545B" stroke-width="12"/><line x1="76" y1="457" x2="76.0462" y2="457" stroke="#A5E1C8" stroke-width="12"/><rect x="623" y="158" width="530" height="340" rx="18" fill="#182F35" stroke="#34545B"/><text x="651" y="211" fill="#FFB56B" font-size="29" font-weight="700" text-anchor="start">困难样本</text><text x="651" y="266" fill="#F3EDE1" font-size="32" font-weight="400" text-anchor="start">pₜ = 0.2</text><text x="651" y="323" fill="#FFB56B" font-size="30" font-weight="700" text-anchor="start">乘法权重 = 0.6400</text><text x="651" y="370" fill="#B8CCC9" font-size="24" font-weight="400" text-anchor="start">交叉熵 = 1.60944</text><text x="651" y="425" fill="#FFB56B" font-size="27" font-weight="700" text-anchor="start">Focal loss = 1.030040</text><line x1="651" y1="457" x2="1113" y2="457" stroke="#34545B" stroke-width="12"/><line x1="651" y1="457" x2="946.6800000000001" y2="457" stroke="#FFB56B" stroke-width="12"/><text x="48" y="552" fill="#F3EDE1" font-size="27" font-weight="700" text-anchor="start">让容易样本“调低音量”，把注意力留给还没学会的例子。</text><text x="48" y="597" fill="#B8CCC9" font-size="23" font-weight="400" text-anchor="start">这不是梯度按同一比例缩放；动态权重本身也随预测变化。</text><text x="48" y="635" fill="#B8CCC9" font-size="23" font-weight="400" text-anchor="start">难样本中若混入大量错标签，聚焦它们可能放大噪声。</text></g></svg>
