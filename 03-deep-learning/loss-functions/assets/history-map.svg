<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="损失函数的演进：我们逐渐改变“什么算好”"><title>损失函数的演进：我们逐渐改变“什么算好”</title><rect width="1200" height="880" rx="24" fill="#101F24"/><g font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif"><text x="48" y="70" fill="#F3EDE1" font-size="34" font-weight="700" text-anchor="start">损失函数的演进：我们逐渐改变“什么算好”</text><text x="48" y="114" fill="#B8CCC9" font-size="24" font-weight="400" text-anchor="start">这是问题驱动的知识地图；各分支并存，不是后者全面替代前者。</text><circle cx="80" cy="187" r="9" fill="#A5E1C8"/><line x1="80" y1="199" x2="80" y2="274" stroke="#34545B" stroke-width="3"/><text x="118" y="195" fill="#A5E1C8" font-size="27" font-weight="700" text-anchor="start">1805 / 1809</text><text x="345" y="191" fill="#F3EDE1" font-size="26" font-weight="700" text-anchor="start">Legendre / Gauss</text><text x="345" y="228" fill="#B8CCC9" font-size="22" font-weight="400" text-anchor="start">把观测误差合并</text><circle cx="80" cy="288" r="9" fill="#FFB56B"/><line x1="80" y1="300" x2="80" y2="375" stroke="#34545B" stroke-width="3"/><text x="118" y="296" fill="#FFB56B" font-size="27" font-weight="700" text-anchor="start">1964</text><text x="345" y="292" fill="#F3EDE1" font-size="26" font-weight="700" text-anchor="start">Peter J. Huber</text><text x="345" y="329" fill="#B8CCC9" font-size="22" font-weight="400" text-anchor="start">控制异常值的影响</text><circle cx="80" cy="389" r="9" fill="#A5E1C8"/><line x1="80" y1="401" x2="80" y2="476" stroke="#34545B" stroke-width="3"/><text x="118" y="397" fill="#A5E1C8" font-size="27" font-weight="700" text-anchor="start">1986</text><text x="345" y="393" fill="#F3EDE1" font-size="26" font-weight="700" text-anchor="start">Rumelhart 等</text><text x="345" y="430" fill="#B8CCC9" font-size="22" font-weight="400" text-anchor="start">损失驱动多层网络学习</text><circle cx="80" cy="490" r="9" fill="#FFB56B"/><line x1="80" y1="502" x2="80" y2="577" stroke="#34545B" stroke-width="3"/><text x="118" y="498" fill="#FFB56B" font-size="27" font-weight="700" text-anchor="start">2015 / 2017</text><text x="345" y="494" fill="#F3EDE1" font-size="26" font-weight="700" text-anchor="start">标签平滑 / Focal</text><text x="345" y="531" fill="#B8CCC9" font-size="22" font-weight="400" text-anchor="start">控制自信与样本权重</text><circle cx="80" cy="591" r="9" fill="#A5E1C8"/><line x1="80" y1="603" x2="80" y2="678" stroke="#34545B" stroke-width="3"/><text x="118" y="599" fill="#A5E1C8" font-size="27" font-weight="700" text-anchor="start">2018–2021</text><text x="345" y="595" fill="#F3EDE1" font-size="26" font-weight="700" text-anchor="start">InfoNCE / SimCLR / CLIP</text><text x="345" y="632" fill="#B8CCC9" font-size="22" font-weight="400" text-anchor="start">学习视图和跨模态关系</text><circle cx="80" cy="692" r="9" fill="#FFB56B"/><text x="118" y="700" fill="#FFB56B" font-size="27" font-weight="700" text-anchor="start">2023–2026</text><text x="345" y="696" fill="#F3EDE1" font-size="26" font-weight="700" text-anchor="start">DPO / GSPO / VESPO</text><text x="345" y="733" fill="#B8CCC9" font-size="22" font-weight="400" text-anchor="start">偏好与策略更新的目标</text><text x="48" y="836" fill="#B8CCC9" font-size="23" font-weight="400" text-anchor="start">最近检索：2026-10-02。论文版本、证据和开放问题见正文。</text></g></svg>
