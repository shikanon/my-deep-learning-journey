<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="对比学习：让关系成为学习信号"><title>对比学习：让关系成为学习信号</title><rect width="1200" height="650" rx="24" fill="#101F24"/><g font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif"><text x="48" y="70" fill="#F3EDE1" font-size="34" font-weight="700" text-anchor="start">对比学习：让关系成为学习信号</text><text x="48" y="114" fill="#B8CCC9" font-size="23" font-weight="400" text-anchor="start">原创二维示意，不是实测嵌入；颜色表示应匹配的样本关系。</text><rect x="48" y="163" width="528" height="350" rx="18" fill="#182F35" stroke="#34545B"/><text x="76" y="212" fill="#F3EDE1" font-size="28" font-weight="700" text-anchor="start">训练前：关系混杂</text><circle cx="148" cy="312" r="24" fill="#A5E1C8"/><text x="148" y="321" fill="#101F24" font-size="21" font-weight="700" text-anchor="middle">猫</text><circle cx="406" cy="410" r="24" fill="#A5E1C8"/><text x="406" y="419" fill="#101F24" font-size="21" font-weight="700" text-anchor="middle">猫</text><circle cx="228" cy="455" r="24" fill="#FFB56B"/><text x="228" y="464" fill="#101F24" font-size="21" font-weight="700" text-anchor="middle">车</text><circle cx="333" cy="280" r="24" fill="#FFB56B"/><text x="333" y="289" fill="#101F24" font-size="21" font-weight="700" text-anchor="middle">车</text><rect x="624" y="163" width="528" height="350" rx="18" fill="#182F35" stroke="#34545B"/><text x="652" y="212" fill="#F3EDE1" font-size="28" font-weight="700" text-anchor="start">训练后：匹配靠近</text><circle cx="779" cy="348" r="24" fill="#A5E1C8"/><text x="779" y="357" fill="#101F24" font-size="21" font-weight="700" text-anchor="middle">猫</text><circle cx="812" cy="370" r="24" fill="#A5E1C8"/><text x="812" y="379" fill="#101F24" font-size="21" font-weight="700" text-anchor="middle">猫</text><circle cx="993" cy="448" r="24" fill="#FFB56B"/><text x="993" y="457" fill="#101F24" font-size="21" font-weight="700" text-anchor="middle">车</text><circle cx="1021" cy="425" r="24" fill="#FFB56B"/><text x="1021" y="434" fill="#101F24" font-size="21" font-weight="700" text-anchor="middle">车</text><text x="48" y="565" fill="#A5E1C8" font-size="27" font-weight="700" text-anchor="start">核心：奖励匹配关系，而不只是逐个预测类别。</text><text x="48" y="607" fill="#B8CCC9" font-size="23" font-weight="400" text-anchor="start">关系怎么定义、温度参数怎么设、负样本是不是“假负例”，都影响结果。</text></g></svg>
