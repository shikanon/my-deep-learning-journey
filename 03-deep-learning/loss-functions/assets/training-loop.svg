<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="AI 训练：四个角色，四种工作"><title>AI 训练：四个角色，四种工作</title><rect width="1200" height="650" rx="24" fill="#101F24"/><g font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif"><text x="48" y="70" fill="#F3EDE1" font-size="34" font-weight="700" text-anchor="start">AI 训练：四个角色，四种工作</text><text x="48" y="112" fill="#B8CCC9" font-size="24" font-weight="400" text-anchor="start">损失定义扣分规则；梯度描述局部变化；优化器执行更新。</text><rect x="48" y="198" width="256" height="178" rx="18" fill="#182F35" stroke="#34545B"/><text x="70" y="249" fill="#A5E1C8" font-size="23" font-weight="700" text-anchor="start">01</text><text x="70" y="298" fill="#F3EDE1" font-size="32" font-weight="700" text-anchor="start">模型预测</text><text x="70" y="339" fill="#B8CCC9" font-size="20" font-weight="400" text-anchor="start">根据输入，输出数字</text><text x="70" y="365" fill="#B8CCC9" font-size="20" font-weight="400" text-anchor="start">或概率</text><line x1="308" y1="289" x2="328" y2="289" stroke="#B8CCC9" stroke-width="3"/><path d="M 322.00,282.00 L 329.00,289.00 L 322.00,296.00" fill="none" stroke="#B8CCC9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="336" y="198" width="256" height="178" rx="18" fill="#182F35" stroke="#34545B"/><text x="358" y="249" fill="#FFB56B" font-size="23" font-weight="700" text-anchor="start">02</text><text x="358" y="298" fill="#F3EDE1" font-size="32" font-weight="700" text-anchor="start">损失函数</text><text x="358" y="339" fill="#B8CCC9" font-size="20" font-weight="400" text-anchor="start">比较预测与目标，计</text><text x="358" y="365" fill="#B8CCC9" font-size="20" font-weight="400" text-anchor="start">算损失</text><line x1="596" y1="289" x2="616" y2="289" stroke="#B8CCC9" stroke-width="3"/><path d="M 610.00,282.00 L 617.00,289.00 L 610.00,296.00" fill="none" stroke="#B8CCC9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="624" y="198" width="256" height="178" rx="18" fill="#182F35" stroke="#34545B"/><text x="646" y="249" fill="#A5E1C8" font-size="23" font-weight="700" text-anchor="start">03</text><text x="646" y="298" fill="#F3EDE1" font-size="32" font-weight="700" text-anchor="start">反向传播</text><text x="646" y="339" fill="#B8CCC9" font-size="20" font-weight="400" text-anchor="start">沿计算图求参数梯度</text><text x="646" y="365" fill="#B8CCC9" font-size="20" font-weight="400" text-anchor="start"></text><line x1="884" y1="289" x2="904" y2="289" stroke="#B8CCC9" stroke-width="3"/><path d="M 898.00,282.00 L 905.00,289.00 L 898.00,296.00" fill="none" stroke="#B8CCC9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="912" y="198" width="256" height="178" rx="18" fill="#182F35" stroke="#34545B"/><text x="934" y="249" fill="#A5E1C8" font-size="23" font-weight="700" text-anchor="start">04</text><text x="934" y="298" fill="#F3EDE1" font-size="32" font-weight="700" text-anchor="start">优化器</text><text x="934" y="339" fill="#B8CCC9" font-size="20" font-weight="400" text-anchor="start">根据梯度与状态更新</text><text x="934" y="365" fill="#B8CCC9" font-size="20" font-weight="400" text-anchor="start">参数</text><path d="M 1060.00,410.00 L 1060.00,465.00 L 170.00,465.00 L 170.00,410.00" fill="none" stroke="#A5E1C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="507" fill="#A5E1C8" font-size="25" font-weight="400" text-anchor="middle">下一轮：用更新后的参数再作答</text><rect x="48" y="548" width="1104" height="60" rx="18" fill="#182F35" stroke="#34545B"/><text x="70" y="588" fill="#F3EDE1" font-size="23" font-weight="400" text-anchor="start">独立验证集上的指标与真实任务效果，用来检查这套评分规则是否合适。</text></g></svg>
