<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="220" viewBox="0 0 1040 220" role="img" aria-label="反向传播：沿计算图回传梯度">
<rect width="1040" height="220" rx="18" fill="#f5f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs>
<g font-family="system-ui, sans-serif">
<text x="40" y="42" font-size="23" fill="#0f172a" font-weight="700">反向传播：沿计算图回传梯度</text>
<rect x="40.0" y="74" width="172.8" height="64" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
<text x="126.4" y="113" text-anchor="middle" font-size="18" fill="#312e81">x, w, b</text>
<path d="M215.8 106 H231.8" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="236.8" y="74" width="172.8" height="64" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
<text x="323.20000000000005" y="113" text-anchor="middle" font-size="18" fill="#312e81">ŷ = wx + b</text>
<path d="M412.6 106 H428.6" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="433.6" y="74" width="172.8" height="64" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
<text x="520.0" y="113" text-anchor="middle" font-size="18" fill="#312e81">L = ½(ŷ − y)²</text>
<path d="M609.4000000000001 106 H625.4000000000001" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="630.4000000000001" y="74" width="172.8" height="64" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
<text x="716.8000000000001" y="113" text-anchor="middle" font-size="18" fill="#312e81">参数梯度</text>
<path d="M806.2 106 H822.2" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="827.2" y="74" width="172.8" height="64" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
<text x="913.6" y="113" text-anchor="middle" font-size="18" fill="#312e81">优化器更新</text>
<text x="40" y="181" font-size="16" fill="#475569">前向：输入 → 预测 → 损失；反向：损失 → 预测 → 参数。计算梯度后再更新参数。</text>
</g></svg>
