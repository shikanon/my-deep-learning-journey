<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">门控的两个独立投影</title><desc id="desc">输入同时产生内容和门，逐通道相乘；Sigmoid 门值介于零和一。</desc><rect width="100%" height="100%" rx="24" fill="#fff9ea"/><g font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif"><text x="600" y="55" font-size="34" fill="#40392f" text-anchor="middle" font-weight="bold">GLU：内容由另一条支路决定通过多少</text><rect x="45" y="215" width="180" height="100" rx="19" fill="#fff9ea" stroke="#40392f" stroke-width="3"/><text x="135.0" y="273" font-size="26" fill="#40392f" text-anchor="middle" font-weight="normal">输入 x</text><rect x="355" y="120" width="300" height="95" rx="19" fill="#dceae2" stroke="#40392f" stroke-width="3"/><text x="505.0" y="178" font-size="26" fill="#40392f" text-anchor="middle" font-weight="normal">内容 a = Wₐx + bₐ</text><rect x="355" y="330" width="300" height="95" rx="19" fill="#f8ddcf" stroke="#40392f" stroke-width="3"/><text x="505.0" y="388" font-size="26" fill="#40392f" text-anchor="middle" font-weight="normal">门 σ(Wgx + bg)</text><rect x="940" y="215" width="215" height="100" rx="19" fill="#fff9ea" stroke="#40392f" stroke-width="3"/><text x="1047.5" y="273" font-size="26" fill="#40392f" text-anchor="middle" font-weight="normal">输出 a ⊙ 门</text><line x1="225" y1="265" x2="290" y2="265" stroke="#40392f" stroke-width="3" /><line x1="290" y1="168" x2="290" y2="378" stroke="#40392f" stroke-width="3" /><line x1="290" y1="168" x2="355" y2="168" stroke="#40392f" stroke-width="3" /><line x1="290" y1="378" x2="355" y2="378" stroke="#40392f" stroke-width="3" /><line x1="655" y1="168" x2="805" y2="168" stroke="#40392f" stroke-width="3" /><line x1="805" y1="168" x2="805" y2="230" stroke="#40392f" stroke-width="3" /><line x1="655" y1="378" x2="805" y2="378" stroke="#40392f" stroke-width="3" /><line x1="805" y1="378" x2="805" y2="300" stroke="#40392f" stroke-width="3" /><line x1="840" y1="265" x2="940" y2="265" stroke="#40392f" stroke-width="3" /><text x="805" y="283" font-size="65" fill="#237c75" text-anchor="middle" font-weight="normal">×</text><text x="600" y="480" font-size="29" fill="#40392f" text-anchor="middle" font-weight="normal">一个通道：内容 4 × 门 0.25 = 1</text><text x="600" y="530" font-size="25" fill="#40392f" text-anchor="middle" font-weight="normal">另一个输入：门变为 0.75，输出就变为 3</text></g></svg>
