<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">异或的非线性特征变换</title><desc id="desc">原始四个点无法线性分开；两个 ReLU 组合后得到 h 为零、一、一、零。</desc><rect width="100%" height="100%" rx="24" fill="#fff9ea"/><g font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif"><text x="600" y="55" font-size="36" fill="#40392f" text-anchor="middle" font-weight="bold">一条直线分不开，先把特征折一下</text><text x="280" y="112" font-size="27" fill="#40392f" text-anchor="middle" font-weight="normal">原空间 · 两类点交叉</text><line x1="100" y1="480" x2="490" y2="480" stroke="#40392f" stroke-width="3" /><line x1="100" y1="480" x2="100" y2="175" stroke="#40392f" stroke-width="3" /><text x="930" y="112" font-size="27" fill="#40392f" text-anchor="middle" font-weight="normal">非线性特征空间</text><line x1="750" y1="480" x2="1140" y2="480" stroke="#40392f" stroke-width="3" /><line x1="750" y1="480" x2="750" y2="175" stroke="#40392f" stroke-width="3" /><text x="455" y="522" font-size="26" fill="#40392f" text-anchor="start" font-weight="normal">x₁</text><text x="74" y="155" font-size="26" fill="#40392f" text-anchor="start" font-weight="normal">x₂</text><circle cx="125" cy="445" r="19" fill="#c65c45"/><text x="153" y="453" font-size="23" fill="#40392f" text-anchor="start" font-weight="normal">(0,0)</text><circle cx="125" cy="215" r="19" fill="#237c75"/><text x="153" y="223" font-size="23" fill="#40392f" text-anchor="start" font-weight="normal">(0,1)</text><circle cx="395" cy="445" r="19" fill="#237c75"/><text x="423" y="453" font-size="23" fill="#40392f" text-anchor="start" font-weight="normal">(1,0)</text><circle cx="395" cy="215" r="19" fill="#c65c45"/><text x="423" y="223" font-size="23" fill="#40392f" text-anchor="start" font-weight="normal">(1,1)</text><line x1="140" y1="240" x2="380" y2="425" stroke="#8f8572" stroke-width="3" stroke-dasharray="10 9"/><text x="280" y="562" font-size="26" fill="#40392f" text-anchor="middle" font-weight="normal">报警的两个点在对角</text><text x="600" y="300" font-size="66" fill="#237c75" text-anchor="middle" font-weight="normal">→</text><text x="600" y="352" font-size="24" fill="#40392f" text-anchor="middle" font-weight="normal">两个 ReLU</text><text x="600" y="385" font-size="24" fill="#40392f" text-anchor="middle" font-weight="normal">组合</text><text x="1142" y="522" font-size="26" fill="#40392f" text-anchor="start" font-weight="normal">s</text><text x="718" y="155" font-size="26" fill="#40392f" text-anchor="start" font-weight="normal">h</text><line x1="750" y1="330" x2="1140" y2="330" stroke="#237c75" stroke-width="3" stroke-dasharray="9 7"/><text x="980" y="315" font-size="22" fill="#237c75" text-anchor="start" font-weight="normal">h = 0.5</text><circle cx="790" cy="445" r="19" fill="#c65c45"/><text x="790" y="522" font-size="21" fill="#40392f" text-anchor="middle" font-weight="normal">(0,0)</text><circle cx="940" cy="215" r="19" fill="#237c75"/><text x="940" y="260" font-size="21" fill="#40392f" text-anchor="middle" font-weight="normal">(0,1) / (1,0)</text><circle cx="1090" cy="445" r="19" fill="#c65c45"/><text x="1090" y="522" font-size="21" fill="#40392f" text-anchor="middle" font-weight="normal">(1,1)</text><text x="950" y="562" font-size="26" fill="#40392f" text-anchor="middle" font-weight="normal">同一类点现在可以被分开</text><text x="600" y="621" font-size="27" fill="#40392f" text-anchor="middle" font-weight="normal">s = x₁ + x₂      h = ReLU(s) − 2 ReLU(s − 1)</text></g></svg>
